name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project and import assets
        run: godot --headless --editor --path . --quit
godot --headless --path . --script res://tests/validate.gd
      - name: Export Windows desktop
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/AFTERHOURS.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AFTERHOURS-Windows
          path: builds/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/windows/*
